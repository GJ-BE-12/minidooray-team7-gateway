<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 목록</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h1 { margin: 0; color: #333; }
        .header form { margin: 0; }
        .header button { padding: 0.5rem 1rem; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .header button:hover { background-color: #c82333; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; color: #555; }
        tbody tr:hover { background-color: #f1f1f1; }
        .empty-list { text-align: center; color: #777; padding: 2rem; }
        .project-link { color: #007bff; text-decoration: none; }
        .project-link:hover { text-decoration: underline; }
        .actions-bar {
            margin-bottom: 1rem;
            text-align: right; /* 버튼을 오른쪽 정렬 */
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none; /* <a> 태그일 경우를 위해 */
            font-size: 0.95em;
            font-weight: 500;
        }
        .btn:hover {
            background-color: #0056b3;
        }

        /* 테이블 안의 버튼들 스타일 */
        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.9em;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>프로젝트 목록</h1>

        <form th:action="@{/users/login}" method="post">
            <span style="margin-right: 1rem;" sec:authentication="name"></span>님
            <button type="submit">로그아웃</button>
        </form>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        프로젝트 목록을 불러오는 데 실패했습니다.
    </div>

    <div class="actions-bar">
        <a th:href="@{/projects/new}" class="btn">프로젝트 생성</a>
    </div>
    <div th:unless="${error}">
        <table>
            <thead>
            <tr>
                <th>프로젝트 ID</th>
                <th>프로젝트명</th>
                <th>상태</th>
<!--                <th>관리</th>-->
            </tr>
            </thead>
            <tbody>
            <tr th:each="project : ${projects}">
                <td th:text="${project.projectId}">1</td>
                <td>
                    <a th:href="@{/projects/{projectId}(id=${project.projectId})}"
                       th:text="${project.name}"
                       class="project-link">샘플 프로젝트</a>
                </td>
                <td th:text="${project.status}">활성</td>
<!--                <td>-->
<!--                    <a th:href="@{/projects/{projectId}/edit(id=${project.projectId})}">수정</a>-->
<!--                    <form th:action="@{/projects/{projectId}(id=${project.projectId})}" method="post" style="display: inline;" onsubmit="return confirm('정말로 이 프로젝트를 삭제하시겠습니까?');">-->
<!--                        <input type="hidden" name="_method" value="delete" />-->
<!--                        <button type="submit">삭제</button>-->
<!--                    </form>-->
<!--                </td>-->
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="4" class="empty-list">표시할 프로젝트가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
