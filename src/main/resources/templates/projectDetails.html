<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 상세</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h1 { margin: 0; color: #333; }
        .back-link { color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        .task-list { list-style-type: none; padding: 0; }
        .task-list li { padding: 0.75rem; border-bottom: 1px solid #eee; }
        .task-list li:last-child { border-bottom: none; }
        /* (신규) 태스크 링크 스타일 */
        .task-list li a { color: #007bff; text-decoration: none; font-weight: 500; }
        .task-list li a:hover { text-decoration: underline; }

        .form-toggle-section { margin-top: 2rem; }
        /* (신규) <a> 태그를 버튼처럼 보이게 하는 스타일 */
        .action-button {
            padding: 0.6rem 1.2rem;
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
        }
        .action-button:hover { opacity: 0.85; }

        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 th:object="${project}" th:text="*{projectName}">프로젝트 이름</h1>
        <a th:href="@{/projectList}" class="back-link">목록으로 돌아가기</a>
    </div>

    <div th:object="${project}">
        <p><strong>ID:</strong> <span th:text="*{projectId}"></span></p>
        <p><strong>상태:</strong> <span th:text="*{projectStatus}"></span></p>
    </div>

    <div th:if="${param.error == 'task_create_failed'}" class="alert alert-danger">
        태스크 생성에 실패했습니다.
    </div>

    <div class="task-section">
        <h2>태스크 목록</h2>
        <ul class="task-list" th:object="${project}">
            <li th:each="task : *{tasks}">
                <a th:href="@{/tasks/{id}(id=${task.taskId})}"
                   th:text="${task.title}">태스크 제목 1</a>
            </li>
            <li th:if="${#lists.isEmpty(project.tasks)}">태스크가 없습니다.</li>
        </ul>
    </div>

    <div class="form-toggle-section">
        <a th:href="@{/projects/{id}/tasks/new(id=${project.projectId})}"
           class="action-button">새 태스크 생성</a>
    </div>

</div>

</body>
</html>
