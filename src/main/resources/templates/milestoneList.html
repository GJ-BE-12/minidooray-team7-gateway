<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마일스톤 관리</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h1 { margin: 0; color: #333; }
        .back-link { color: #007bff; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; border-bottom: 1px solid #ddd; text-align: left; }
        .form-section { margin-top: 1.5rem; }
        button[type="submit"] { padding: 0.5rem 1rem; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .delete-button { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>마일스톤 관리</h1>
        <a th:href="@{/projects/{id}(id=${projectId})}" class="back-link">프로젝트로 돌아가기</a>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        마일스톤 처리에 실패했습니다.
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>마일스톤명</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ms : ${milestones}">
            <td th:text="${ms.milestoneId}">1</td>
            <td th:text="${ms.milestoneName}">v1.0</td>
            <td>
                <form th:action="@{/projects/{projectId}/milestones/{msId}/delete(projectId=${projectId}, msId=${ms.milestoneId})}" method="post">
                    <button type="submit" class="delete-button">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(milestones)}">
            <td colspan="3">생성된 마일스톤이 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <div class="form-section">
        <h2>새 마일스톤 생성</h2>
        <form th:action="@{/projects/{id}/milestones(id=${projectId})}" th:object="${milestoneCreateRequest}" method="post">
            <input type="text" th:field="*{milestoneName}" placeholder="마일스톤명" required>
            <button type="submit">마일스톤 생성</button>
        </form>
    </div>
</div>
</body>
</html>
