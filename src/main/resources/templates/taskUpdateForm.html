<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>태스크 수정</title>
</head>
<body>
<div class="container">
    <h1>태스크 수정</h1>

    <form th:action="@{/projects/{projectId}/tasks/{taskId}(projectId=${projectId}, taskId=${taskId})}"
          th:object="${taskUpdateRequest}"
          method="post">
        <input type="hidden" name="_method" value="put" />

        <div class="form-group">
            <label for="title">제목:</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div class="form-group">
            <label for="content">내용:</label>
            <textarea id="content" th:field="*{body}" rows="6"></textarea>
        </div>

        <button type="submit">태스크 수정 완료</button>
    </form>

    <a th:href="@{/projects/{projectId}/tasks/{taskId}(projectId=${projectId}, taskId=${taskId})}" class="back-link">태스크 상세로 돌아가기</a>
</div>
</body>
</html>
