<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>태그 관리</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h1 { margin: 0; color: #333; }
        .back-link { color: #007bff; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; border-bottom: 1px solid #ddd; text-align: left; }
        .form-section { margin-top: 1.5rem; }
        button[type="submit"] { padding: 0.5rem 1rem; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .delete-button { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>태그 관리</h1>
        <a th:href="@{/projects/{id}(id=${projectId})}" class="back-link">프로젝트로 돌아가기</a>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        태그 처리에 실패했습니다.
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>태그명</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tag : ${tags}">
            <td th:text="${tag.tagId}">1</td>
            <td th:text="${tag.name}">태그1</td>
            <td>
                <form th:action="@{/projects/{projectId}/tags/{tagId}(projectId=${projectId}, tagId=${tag.tagId})}" method="post" onsubmit="return confirm('정말로 이 태그를 삭제하시겠습니까?');">
                    <input type="hidden" name="_method" value="delete" />
                    <button type="submit" class="delete-button">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tags)}">
            <td colspan="3">생성된 태그가 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <div class="form-section">
        <h2>새 태그 생성</h2>
        <form th:action="@{/projects/{id}/tags(id=${projectId})}" th:object="${tagCreateRequest}" method="post">
            <input type="text" th:field="*{name}" placeholder="태그명" required>
            <button type="submit">태그 생성</button>
        </form>
    </div>
</div>
</body>
</html>
